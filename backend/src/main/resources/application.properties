spring.application.name=control-pagina
server.port=8080

# MySQL — sobrescribir en producción con variables de entorno
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/PaginaCod?createDatabaseIfNotExist=true&useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=false}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:admin}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=10000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# File upload
file.upload-dir=${FILE_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# SSL (terminar HTTPS en reverse proxy en producción)
server.ssl.enabled=false

# No exponer stacktraces en respuestas HTTP
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# CORS — orígenes del sitio público y del panel CMS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}

# Credenciales del administrador del CMS (cambiar en producción)
app.admin.username=${ADMIN_USER:admin}
app.admin.password=${ADMIN_PASSWORD:admin}

# Logging
logging.level.root=INFO
logging.level.com.controlpagina=INFO
logging.level.org.springframework.security=WARN
